<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
  <style>
    /* Current conditions card */
    #currentCard {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 0.875rem;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }

    /* Section heading */
    #weatherResult h2 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }
    #weatherResult h3 {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      margin-bottom: 0.5rem;
      margin-top: 0;
    }

    /* Current weather stat rows */
    #weatherResult .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.875rem;
      padding: 0.2rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    #weatherResult .stat-row:last-child {
      border-bottom: none;
    }
    #weatherResult .stat-label {
      color: rgba(255,255,255,0.65);
    }
    #weatherResult .stat-value {
      font-weight: 600;
    }

    /* Hourly scroll container */
    #hourlyScroll {
      max-height: 260px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.3) transparent;
    }
    #hourlyScroll::-webkit-scrollbar { width: 4px; }
    #hourlyScroll::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.3);
      border-radius: 4px;
    }

    /* Individual hour card */
    .hour-card {
      background: rgba(255,255,255,0.08);
      border-radius: 0.625rem;
      padding: 0.6rem 0.875rem;
      margin-bottom: 0.5rem;
      font-size: 0.8rem;
    }
    .hour-card .hour-time {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: rgba(255,255,255,0.55);
      margin-bottom: 0.3rem;
    }
    .hour-card .hour-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.15rem 0.5rem;
      color: rgba(255,255,255,0.9);
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-sky-500 via-blue-500 to-indigo-600 flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <h1 class="text-3xl font-bold text-white text-center mb-1 tracking-tight">Weather</h1>
        <p class="text-white/55 text-sm text-center mb-5">Enter a city or location</p>
        <form id="searchForm" class="flex gap-2 mb-2">
            <input
                id="locationInput"
                type="text"
                pattern="[a-zA-Z\s,.\-]+"
                placeholder="e.g. London, New York..."
                autocomplete="off"
                class="flex-1 min-w-0 px-4 py-2.5 rounded-xl bg-white/20 text-white placeholder-white/45 border border-white/30 focus:outline-none focus:ring-2 focus:ring-white/60 text-sm"
            />
            <button
                type="submit"
                class="px-5 py-2.5 bg-white text-blue-600 font-semibold rounded-xl hover:bg-white/90 active:scale-95 transition text-sm shrink-0"
            >
                Search
            </button>
        </form>
        <p id="errorMessage" class="text-red-200 text-xs min-h-[18px] mb-3 px-1"></p>
        <div id="weatherResult" class="text-white"></div>
    </div>

  <script>
    const API_KEY = "997YZBPJYHNSBSXA3JHG9689X";

    const searchForm = document.getElementById("searchForm");
    const locationInput = document.getElementById("locationInput");
    const errorMessage = document.getElementById("errorMessage");
    const weatherResult = document.getElementById("weatherResult");

    const timeFormate = (date) => {
      let y = date.getFullYear()
      let m = String(date.getMonth() + 1).padStart(2,"0")
      let d = String(date.getDate()).padStart(2,"0")
      return `${y}-${m}-${d}`
    }

    searchForm.addEventListener("submit", async(event) => {
      event.preventDefault()
      const location = locationInput.value.trim()

      if(location == ""){
        errorMessage.textContent = "Enter a valid location.";
        return;
      }

      errorMessage.textContent = ""
      
      const today = new Date()
      const yesterday = new Date(today)
      yesterday.setDate(today.getDate() - 1)
      const tomorrow = new Date(today)
      tomorrow.setDate(today.getDate() + 1)

      let start = timeFormate(yesterday)
      let end = timeFormate(tomorrow)

      const url = `https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline/${encodeURIComponent(location)}/${start}/${end}?key=${API_KEY}&unitGroup=metric&include=hours,current`;

      try{
        const response = await axios.get(url)
        const data = response.data
        const weather = data.currentConditions
        let html = `
          <div id="currentCard">
            <h2>${data.resolvedAddress}</h2>
            <h3>Current Weather</h3>
            <div class="stat-row"><span class="stat-label">Temperature</span><span class="stat-value">${weather.temp} °C</span></div>
            <div class="stat-row"><span class="stat-label">Wind Speed</span><span class="stat-value">${weather.windspeed} km/h</span></div>
            <div class="stat-row"><span class="stat-label">Chance of Rain</span><span class="stat-value">${weather.precipprob ?? "N/A"}%</span></div>
            <div class="stat-row"><span class="stat-label">Conditions</span><span class="stat-value">${weather.conditions}</span></div>
          </div>

          <h3 style="font-size:0.7rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);margin-bottom:0.5rem;">Previous and Next 24 Hours</h3>
          <div id="hourlyScroll">
        `;
        
        const now = Date.now()
        const range = 24*60*60*1000

        for(const day of data.days){
          for(const hour of day.hours){
            const time = new Date(`${day.datetime}T${hour.datetime}`).getTime()
            if(Math.abs(time-now) <= range){
              if (Math.abs(time - now) <= range) {
                html += `
                  <div class="hour-card">
                    <div class="hour-time">${day.datetime} &nbsp;${hour.datetime}</div>
                    <div class="hour-stats">
                      <span>${hour.temp} °C</span>
                      <span>Wind ${hour.windspeed} km/h</span>
                      <span>Rain ${hour.precipprob ?? "N/A"}%</span>
                      <span>${hour.conditions}</span>
                    </div>
                  </div>
                `;
              }
            }
          }
        }
        html += `</div>`;
        weatherResult.innerHTML = html;
      }catch {
        weatherResult.textContent = "";
        errorMessage.textContent = "Unable to get weather. Check the location or API key.";
      }
    });
  </script>
</body>
</html>
